languageCode = 'en-us'
title = 'TLA⁺ Foundation'
enableRobotsTXT = true
noChmod = true

[params]
  description = 'An independent, non-profit home for the TLA⁺ specification language, part of the Linux Foundation.'
  youtubeChannel = 'UCLHtwjeqBxVSEhjV0clKblA'
  youtubeHandle = 'tlaplusfoundation'
  joinURL = 'https://enrollment.lfx.linuxfoundation.org/?project=tla'
  meetingsURL = 'https://zoom-lfx.platform.linuxfoundation.org/meetings/tla'
  # Top-level paths that belong to the Foundation; the Foundation nav item stays current inside them.
  foundationSections = ['blog', 'grants', 'industry', 'challenge']

[markup.goldmark.renderer]
  unsafe = true

